name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goarch: arm64
            suffix: darwin-arm64
          - os: macos-13
            goarch: amd64
            suffix: darwin-amd64
          - os: ubuntu-latest
            goarch: amd64
            suffix: linux-amd64
          - os: windows-latest
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build React app
        working-directory: app
        run: npm ci && npx vite build

      - name: Copy UI build into server embed directory
        shell: bash
        run: |
          mkdir -p server/ui/dist
          cp -r app/dist/. server/ui/dist/

      - name: Build Go server
        working-directory: server
        env:
          CGO_ENABLED: '1'
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o ../aycorn-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/web

      - uses: actions/upload-artifact@v4
        with:
          name: aycorn-${{ matrix.suffix }}
          path: aycorn-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
